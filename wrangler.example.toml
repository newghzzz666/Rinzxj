#:schema node_modules/wrangler/config-schema.json
name = "rin-server"
main = "server/src/_worker.ts"
compatibility_date = "2024-05-29"
# compatibility_flags = ["nodejs_compat"]
node_compat = true

[triggers]
crons = ["*/20 * * * *"]

[vars]
FRONTEND_URL = "http://localhost:5173"
S3_FOLDER = "images/"
S3_CACHE_FOLDER="cache/"
S3_REGION = "auto"
S3_ENDPOINT = "<YourS3Endpoint>"
S3_ACCESS_HOST = "<YourS3AccessHost>"
S3_BUCKET = "<YourS3BucketName>"
S3_FORCE_PATH_STYLE = "false"
WEBHOOK_URL = "https://<YourWebhookURL>"
RSS_TITLE = "Rin Development Environment"
RSS_DESCRIPTION = "Development Environment"

[[d1_databases]]
binding = "DB"
database_name = "rin"
database_id = "YourDatabaseID"

# Cloudflare KV 缓存配置（可选，用于加速博客访问）
# 使用方法：
# 1. 在 Cloudflare Dashboard 中创建 KV 命名空间，名称建议为 "rin-cache"
# 2. 将下面的 id 替换为你创建的 KV 命名空间 ID
# 3. 如不配置 KV，系统将自动降级使用 R2 缓存
[[kv_namespaces]]
binding = "CACHE_KV"
id = "<YourKVNamespaceID>"
